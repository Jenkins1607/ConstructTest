<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View our portfolio and past projects at [Site purpose]">
    <meta name="color-scheme" content="light dark">
    <title>TOH</title>
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- jQuery 3.6.0 (Required for Fancybox) -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/fancybox@3.5.7/dist/jquery.fancybox.min.css" />
</head>

<body class="theme-auto">
    <!-- Header with navigation -->
    <header class="site-header">

                    <h1>TOH</h1>
                </div>

                <!-- Mobile menu toggle button -->

                </button>

                <!-- Main navigation -->
                <nav class="main-nav">
                    <ul class="nav-list">
                        <li><a href="portfolio.html" class="active">Portfolio</a></li>
                    </ul>
                </nav>

                <!-- UPDATED: Dark mode toggle button -->
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" aria-pressed="false">
                    <svg class="theme-icon theme-icon-sun" width="20" height="20" viewBox="0 0 20 20" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <circle cx="10" cy="10" r="4" stroke="currentColor" stroke-width="2" />
                        <path
                            d="M10 2V4M10 16V18M18 10H16M4 10H2M15.657 4.343L14.243 5.757M5.757 14.243L4.343 15.657M15.657 15.657L14.243 14.243M5.757 5.757L4.343 4.343"

                    </svg>
                    <svg class="theme-icon theme-icon-moon" width="20" height="20" viewBox="0 0 20 20" fill="none"
                        xmlns="http://www.w3.org/2000/svg">
                        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"
                            stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
                    </svg>

            </div>
        </div>
    </header>

    <!-- Page header -->
    <section class="page-header">
        <div class="container">
            <h2>Галерея работ</h2>
        </div>
    </section>

    <!-- Portfolio gallery section -->
    <section class="portfolio-section">
        <div class="container">
            <!-- Portfolio filter buttons -->
            <div class="portfolio-filters">

            <div id="electrical-gallery" class="fancybox-gallery-group active">
                <h3>Электромонтаж</h3>
                <div class="gallery-grid">
                    <a data-fancybox="electrical" href="https://images.unsplash.com/photo-1621905251189-08b45d6a269e?w=1200">
                        <img src="https://images.unsplash.com/photo-1621905251189-08b45d6a269e?w=400" alt="Электромонтаж: Щиток">
                    </a>
                    <a data-fancybox="electrical" href="https://images.unsplash.com/photo-1558402529-d2638a7023e9?w=1200">
                        <img src="https://images.unsplash.com/photo-1558402529-d2638a7023e9?w=400" alt="Электромонтаж: Проводка">
                    </a>
                    <a data-fancybox="electrical" href="https://images.unsplash.com/photo-1497366216548-37526070297c?w=1200">

                    <a data-fancybox="electrical" href="https://images.unsplash.com/photo-1544724569-5f546fd6f2b5?w=1200">
                        <img src="https://images.unsplash.com/photo-1544724569-5f546fd6f2b5?w=400" alt="Электромонтаж: Плата">
                    </a>
                </div>
            </div>

            <!-- Plumbing Gallery -->
            <div id="plumbing-gallery" class="fancybox-gallery-group">
                <h3>Сантехника</h3>
                <div class="gallery-grid">
                    <a data-fancybox="plumbing" href="https://images.unsplash.com/photo-1585704032915-c3400ca199e7?w=1200">
                        <img src="https://images.unsplash.com/photo-1585704032915-c3400ca199e7?w=400" alt="Сантехника: Кухонная мойка">
                    </a>
                    <a data-fancybox="plumbing" href="https://images.unsplash.com/photo-1604014237800-1c9102c219da?w=1200">
                        <img src="https://images.unsplash.com/photo-1604014237800-1c9102c219da?w=400" alt="Сантехника: Современные fixtures">
                    </a>
                    <a data-fancybox="plumbing" href="https://images.unsplash.com/photo-1595428774223-ef52624120d2?w=1200">
                        <img src="https://images.unsplash.com/photo-1595428774223-ef52624120d2?w=400" alt="Сантехника: Трубы">

                    <a data-fancybox="plumbing" href="https://images.unsplash.com/photo-1507089947368-19c1da9775ae?w=1200">

                    </a>
                    <a data-fancybox="plumbing" href="https://images.unsplash.com/photo-1620626011761-996317b8d101?w=1200">
                        <img src="https://images.unsplash.com/photo-1620626011761-996317b8d101?w=400" alt="Сантехника: Водонагреватель">

    <!-- Footer -->

        <div class="container">
            <div class="footer-content">
                <div class="footer-section">

                <div class="footer-section">

                    <ul>

                <div class="footer-section">

                    <p>Email: info@example.com</p>
                    <p>Phone: (123) 456-7890</p>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2025 [Site purpose]. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- UPDATED: Sticky mobile theme toggle -->
    <button class="theme-toggle-mobile" id="themeToggleMobile" aria-label="Toggle dark mode" aria-pressed="false">
        <svg class="theme-icon theme-icon-sun" width="24" height="24" viewBox="0 0 20 20" fill="none"
            xmlns="http://www.w3.org/2000/svg">
            <circle cx="10" cy="10" r="4" stroke="currentColor" stroke-width="2" />
            <path
                d="M10 2V4M10 16V18M18 10H16M4 10H2M15.657 4.343L14.243 5.757M5.757 14.243L4.343 15.657M15.657 15.657L14.243 14.243M5.757 5.757L4.343 4.343"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" />

        <svg class="theme-icon theme-icon-moon" width="24" height="24" viewBox="0 0 20 20" fill="none"
            xmlns="http://www.w3.org/2000/svg">

    </button>

    <!-- JavaScript -->
    <script src="js/app.js"></script>
        <!-- Fancybox JS -->
    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/fancybox@3.5.7/dist/jquery.fancybox.min.js"></script>
    
    <!-- Main JavaScript -->
    <script src="js/app.js"></script>

    <!-- Fancybox Initialization -->
    <script>
        $(document).ready(function() {
            $('[data-fancybox]').fancybox({
                buttons: [
                    "zoom",
                    "share",
                    "slideShow",
                    "fullScreen",
                    "download",
                    "thumbs",
                    "close"
                ],
                loop: true,
                protect: true // Защита от копирования (отключает правый клик на изображении)
            });
        });
    </script>
</body>

</html>
